version: 2
updates:
  # Root package (the module itself)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - "dependencies"
      - "npm"
    groups:
      nuxt:
        patterns:
          - "nuxt"
          - "@nuxt/*"
          - "nuxt-*"
      vue:
        patterns:
          - "vue"
          - "@vue/*"
      pdfjs:
        patterns:
          - "pdfjs-dist"
          - "@pdfjs/*"

  # Docs site
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - "dependencies"
      - "npm"
      - "docs"
    groups:
      nuxt:
        patterns:
          - "nuxt"
          - "@nuxt/*"
          - "nuxt-*"
          - "docus"
      vue:
        patterns:
          - "vue"
          - "@vue/*"

  # Playground
  - package-ecosystem: "npm"
    directory: "/playground"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - "dependencies"
      - "npm"
      - "playground"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
